name: Refresh spot prices

on:
  schedule:
    - cron: "17 13 * * *"   # about 7:17am Central
    - cron: "17 21 * * *"   # about 3:17pm Central
  workflow_dispatch:
  push:
    paths: ["coins.py", "build.py", "fetch_spot.py"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch spot
        run: python fetch_spot.py
      - name: Build site
        run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "melt-bot"
          git config user.email "melt-bot@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || git commit -m "Daily spot refresh"
          git push
